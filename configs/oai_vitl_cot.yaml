pano_detector: "grounding_dino-l"
pano_detector_path: 'grounding_dino/grounding_dino_swint_ogc.pth'
local_inferer: "LateFiLM"
local_inferer_path: 'checkpoints/LateFiLM_vitl14.pth'

dino_model_type: "dinov2_vitl14"
dino_use_registers: False
text_embedding_func: "embeddings_oai"

model_structure:
  in_channels: 1024
  filters: [256, 64, 1]
  kernel_sizes: [3, 3, 1]
  strides: [1, 1, 1]
  norm: null
  activation: "lrelu"
  lang_emb_dim: 1024
  film_mode: "rand"

optim:
  lr: 0.002
  weight_decay: 0.0
  step_size: 10
  gamma: 0.75

trainer:
  batch_size: 32
  num_epochs: 50
  save_every: 10
  val_every: 10
  random_pad: true
  val_split: 0.1

criterion: "BCE"
pano_detector_conf: 0.3
pano_detector_iou: 0.7
box_expand_ratio: 0.0
heatmap_thresh: 0.2
max_det: 20
