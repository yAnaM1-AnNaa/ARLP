global_detector:
  name: "grounding_dino"  # grounding_dino | yolo_world
  model_path: "/root/autodl-tmp/ARLP/grounding-dino-base"

  # Detector-specific parameters.
  # GroundingDINO uses box_threshold/text_threshold for post-processing.
  # YOLOWorld uses conf/iou/max_det. For compatibility, conf is also accepted.
  params:
    box_threshold: 0.2
    text_threshold: 0.2
    iou: 0.7
    max_det: 20

local_inferer:
  name: "earlyfilm"
  checkpoint_path: "/root/autodl-tmp/ARLP/checkpoints/early_film/best (1).pth"
  load_strict: false

  # Required by EarlyFiLM. These keys are passed directly to EarlyFiLMDINOv2.
  model:
    vision_model_name: "vit_large_patch14_dinov2.lvd142m"
    text_encoder: "roberta-large"
    resolution: 756
    film_layers: [6, 12, 18, 23]
    film_hidden_dim: null
    feature_aggregation: "mean"
    modulate_prefix_tokens: false
    pretrained_vision: true
  batch_size: 1

pano_fusion:
  # Expand each detected box before local inference.
  box_expand_ratio: 0.0

  # Threshold passed into local crop inference.
  # Use null to keep continuous heatmaps. This is recommended for evaluation.
  local_heatmap_thresh: null

  # Optional threshold after crop heatmaps are pasted back into the full image.
  final_heatmap_thresh: null

  # How overlapping crop heatmaps are merged.
  # mean is the recommended default because it avoids rewarding duplicated boxes.
  overlap_mode: "mean"  # mean | sum | max

eval:
  prompt_config: "configs/agd_prompts.yaml"
