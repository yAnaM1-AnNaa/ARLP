bathe:
  bathtub:
    detector_classes: ["bathtub", "tub", "bath tub"]
    affordance_prompt: >
      Inside basin surface of the bathtub where a person sits or lies while bathing.
      Focus on the smooth inner bottom and side-contact area that supports the body,
      not the outer wall or floor around the tub.

climb:
  stairway:
    detector_classes: ["stairway", "stairs", "staircase", "steps"]
    affordance_prompt: >
      Horizontal step surfaces of the stairway where a foot is placed while climbing.
      Focus on the flat treads that support the feet, not the vertical risers,
      railings, or side walls.

display:
  screen:
    detector_classes: ["screen", "display", "monitor"]
    affordance_prompt: >
      Front screen surface that displays visual information to a viewer. Focus on
      the active flat display panel, not the bezel, stand, buttons, or surrounding frame.

drop:
  garbage:
    detector_classes: ["trash can", "garbage can", "bin", "waste bin"]
    affordance_prompt: >
      Opening or inner container region where garbage should be dropped. Focus on
      the accessible mouth, bin cavity, or exposed receptacle area, not the outer
      shell or nearby floor.

heating:
  microwave:
    detector_classes: ["microwave", "microwave oven"]
    affordance_prompt: >
      Interior cavity of the microwave where items are placed for heating. Focus on
      the inner tray, shelf, and chamber area that holds food, not the door front,
      buttons, or exterior casing.

lean_back:
  backreat:
    detector_classes: ["backrest", "chair backrest", "seat backrest"]
    affordance_prompt: >
      Front support surface of the backrest where a person's back leans. Focus on
      the broad rear support pad or panel behind the seat, not the seat cushion,
      legs, or outer frame.

lie:
  bed:
    detector_classes: ["bed", "mattress"]
    affordance_prompt: >
      Top mattress surface of the bed where a person lies down. Focus on the broad
      horizontal sleeping area that supports the body, not the headboard, bed frame,
      pillows, or floor.

light:
  lamp:
    detector_classes: ["lamp", "light", "lampshade"]
    affordance_prompt: >
      Light-emitting bulb, shade opening, or illuminated shade area of the lamp.
      Focus on the part that produces or diffuses light, not the pole, base, cord,
      or surrounding furniture.

look_through:
  window:
    detector_classes: ["window", "glass window"]
    affordance_prompt: >
      Transparent glass pane area of the window that a person looks through. Focus
      on the see-through pane surface, not the frame, wall, sill, handle, or curtain.

lying_on:
  pillow:
    detector_classes: ["pillow", "cushion"]
    affordance_prompt: >
      Soft top surface of the pillow where the head rests. Focus on the cushioned
      upper contact area, not the bed, blanket, pillow edge seam, or surrounding objects.

open:
  door:
    detector_classes: ["door", "door panel"]
    affordance_prompt: >
      Handle, knob, grip, or exposed edge region of the door used to open it. Focus
      on the part a hand contacts to pull or push the door, not the broad decorative
      door panel or nearby wall.

place:
  table:
    detector_classes: ["table", "desk", "tabletop"]
    affordance_prompt: >
      Flat top surface of the table where objects are placed. Focus on the horizontal
      tabletop support area, not the legs, side panels, floor, or items already sitting on it.

pull:
  drawer:
    detector_classes: ["drawer", "cabinet drawer"]
    affordance_prompt: >
      Front handle, knob, groove, or grip region of the drawer used for pulling it
      outward. Focus on the hand-contact pull area, not the drawer interior, cabinet
      frame, or surrounding furniture.

reflect_image:
  mirror:
    detector_classes: ["mirror", "looking glass"]
    affordance_prompt: >
      Reflective front surface of the mirror where images appear. Focus on the smooth
      reflective glass area, not the frame, wall, stand, or nearby objects.

refrigerate:
  refrigerator:
    detector_classes: ["refrigerator", "fridge"]
    affordance_prompt: >
      Interior storage area of the refrigerator where items are kept cold. Focus on
      the shelves, bins, and inner compartment surfaces that hold food, not the
      exterior door, handle, or control panel.

rest_arm:
  armset:
    detector_classes: ["armrest", "chair armrest", "sofa armrest"]
    affordance_prompt: >
      Upper support surface of the armrest where a person's arm rests. Focus on the
      elongated top contact area beside the seat, not the seat cushion, backrest,
      legs, or side frame.

sit:
  sofa_seat:
    detector_classes: ["sofa seat", "sofa", "couch", "seat cushion"]
    affordance_prompt: >
      Top sitting surface of the seat where a person places their body weight.
      Focus on the horizontal cushion or sitting platform, not the backrest, legs,
      armrests, or surrounding floor.
  seat:
    detector_classes: ["seat", "seat cushion", "chair seat", "sofa seat"]
    affordance_prompt: >
      Top sitting surface of the seat where a person places their body weight.
      Focus on the horizontal cushion or sitting platform, not the backrest, legs,
      armrests, or surrounding floor.

swing_open:
  cabinet_door:
    detector_classes: ["cabinet door", "cupboard door"]
    affordance_prompt: >
      Handle, knob, pull edge, or outer graspable region of the cabinet door used
      to swing it open. Focus on the hand-contact opening part, not the fixed
      cabinet body, shelves, or adjacent wall.

wash:
  sink:
    detector_classes: ["sink", "wash basin", "basin"]
    affordance_prompt: >
      Basin area of the sink where washing takes place. Focus on the inner bowl,
      drain area, and water-contact surface, not the faucet, countertop, cabinet,
      or surrounding wall.
